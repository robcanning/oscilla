  <text
     xml:space="preserve"
     style="font-weight:bold;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:'FreeMono Bold';text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;fill:#000000"
     x="147.0233"
     y="448.29208"
     id="text1"><tspan
       sodipodi:role="line"
       id="tspan1"
       x="147.0233"
       y="448.29208"
       style="font-size:21.3333px">the below buttons are created with ids</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="474.95871"
       id="tspan10"
       style="font-size:21.3333px" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="501.62534"
       id="tspan11"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page0)_style(size:&quot;50x25&quot;,color:&quot;#4477dd&quot;,label:&quot;A&quot;))</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="528.29193"
       id="tspan2"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page1)_style(size:&quot;50x25&quot;,color:&quot;#44bb77&quot;,label:&quot;B&quot;))</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="554.95856"
       id="tspan3"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page2)_style(size:&quot;50x25&quot;,color:&quot;#cc6644&quot;,label:&quot;C&quot;))</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="581.62518"
       id="tspan4"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page3)_style(size:&quot;50x25&quot;,color:&quot;#888&quot;,label:&quot;D&quot;))</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="608.29181"
       id="tspan13"
       style="font-size:21.3333px" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="634.95844"
       id="tspan14"
       style="font-size:21.3333px">and then placed in a inkscape group with the id <tspan
   style="fill:#0000ff"
   id="tspan22">group-mainMenu</tspan></tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="661.62506"
       style="font-size:21.3333px"
       id="tspan15" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="688.29169"
       style="font-size:21.3333px"
       id="tspan16">then in any other page we can create clones of this menu with:</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="714.95831"
       style="font-size:21.3333px"
       id="tspan21" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="751.49164"
       style="font-size:32px;fill:#0000ff"
       id="tspan19">cueGroup(mainMenu)</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="781.62494"
       style="font-size:21.3333px"
       id="tspan17" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="808.29156"
       style="font-size:21.3333px"
       id="tspan18" /><tspan
