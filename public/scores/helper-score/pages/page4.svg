       sodipodi:role="line"
       x="147.0233"
       y="861.62482"
       id="tspan12"
       style="font-size:21.3333px" /></text>
  <text
     xml:space="preserve"
     style="font-weight:bold;font-size:64px;font-family:FreeMono;-inkscape-font-specification:'FreeMono Bold';text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;fill:#000000"
