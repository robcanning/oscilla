  <text
     xml:space="preserve"
     style="font-size:21.3333px;white-space:pre;inline-size:1179.2;display:inline;fill:#000000"
     x="155.13109"
     y="142.2868"
     id="text166"
     transform="translate(-55.29661,31.806144)"><tspan
       x="155.13109"
       y="142.2868"
       id="tspan4"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan3">The cueNav command provides navigation control within OscillaScore, allowing performers or </tspan></tspan><tspan
       x="155.13109"
       y="169.27609"
       id="tspan7"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan6">the score itself to jump between pages or switch display modes during playback. A cue like </tspan></tspan><tspan
       x="155.13109"
       y="196.26538"
       id="tspan30"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan8">cueNav(goto(page1)) directs the system to load a specific page, while cueNav(mode(scroll)) </tspan></tspan><tspan
       x="155.13109"
       y="223.25466"
       id="tspan32"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan31">exits page mode and returns to the continuous scrolling score view. In addition to simple </tspan></tspan><tspan
       x="155.13109"
       y="250.24395"
       id="tspan34"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan33">“goto” and “mode” actions, cueNav supports optional parameters such as timed transitions </tspan></tspan><tspan
       x="155.13109"
       y="277.23324"
       id="tspan36"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan35">(_wait(n)), chained cues (triggering additional actions after navigation), and integration </tspan></tspan><tspan
       x="155.13109"
       y="304.22253"
       id="tspan38"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan37">with the broader cue system—meaning navigation can be synchronized across clients or linked </tspan></tspan><tspan
       x="155.13109"
       y="331.21182"
       id="tspan40"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan39">to other events like media playback or repeats. 
</tspan></tspan><tspan
       x="155.13109"
       y="358.20111"
       id="tspan42"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan41">
</tspan></tspan><tspan
       x="155.13109"
       y="385.19039"
       id="tspan44"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan43">It effectively serves as the bridge between static pages and fluid scrolling navigation, </tspan></tspan><tspan
       x="155.13109"
       y="412.17968"
       id="tspan46"><tspan
         style="font-family:FreeMono;-inkscape-font-specification:FreeMono"
         id="tspan45">giving composers precise control over the score’s visual and temporal flow.</tspan></tspan></text>
