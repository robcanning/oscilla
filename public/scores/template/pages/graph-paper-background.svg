<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="40000"
   height="1024"
   viewBox="0 0 40000 1024"
   version="1.1"
   id="graph-paper-background"
   xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <!-- MINOR GRID: 10×10 px (very fine) -->
    <pattern
       id="minorGrid"
       width="10"
       height="10"
       patternUnits="userSpaceOnUse">
      <path
         d="M 10 0 L 0 0 0 10"
         fill="none"
         stroke="#f0f0f0"
         stroke-width="0.5" />
    </pattern>
    
    <!-- MEDIUM GRID: 100×100 px squares -->
    <pattern
       id="mediumGrid"
       width="100"
       height="100"
       patternUnits="userSpaceOnUse">
      <rect
         width="100"
         height="100"
         fill="url(#minorGrid)" />
      <path
         d="M 100 0 L 0 0 0 100"
         fill="none"
         stroke="#d0d0d0"
         stroke-width="1" />
    </pattern>
    
    <!-- LARGE GRID: 500×500 px squares -->
    <pattern
       id="largeGrid"
       width="500"
       height="500"
       patternUnits="userSpaceOnUse">
      <rect
         width="500"
         height="500"
         fill="url(#mediumGrid)" />
      <path
         d="M 500 0 L 0 0 0 500"
         fill="none"
         stroke="#b0b0b0"
         stroke-width="1.5" />
    </pattern>
  </defs>
  
  <!-- Background fill -->
  <rect
     width="40000"
     height="1024"
     fill="#ffffff"
     id="background" />
  
  <!-- Grid overlay -->
  <rect
     width="40000"
     height="1024"
     fill="url(#largeGrid)"
     id="grid" />
  
  <!-- Vertical major divisions every 4000px (10 divisions total) -->
  <g id="major-divisions" stroke="#b0b0b0" stroke-width="2.5" opacity="0.5">
    <line x1="4000" y1="0" x2="4000" y2="1024" />
    <line x1="8000" y1="0" x2="8000" y2="1024" />
    <line x1="12000" y1="0" x2="12000" y2="1024" />
    <line x1="16000" y1="0" x2="16000" y2="1024" />
    <line x1="20000" y1="0" x2="20000" y2="1024" />
    <line x1="24000" y1="0" x2="24000" y2="1024" />
    <line x1="28000" y1="0" x2="28000" y2="1024" />
    <line x1="32000" y1="0" x2="32000" y2="1024" />
    <line x1="36000" y1="0" x2="36000" y2="1024" />
  </g>
  
  <!-- Optional: Section labels (can be hidden in Inkscape if not needed) -->
  <g id="section-labels" font-family="sans-serif" font-size="80" fill="#a0a0a0" opacity="0.3">
    <text x="2000" y="100" text-anchor="middle">0-4K</text>
    <text x="6000" y="100" text-anchor="middle">4-8K</text>
    <text x="10000" y="100" text-anchor="middle">8-12K</text>
    <text x="14000" y="100" text-anchor="middle">12-16K</text>
    <text x="18000" y="100" text-anchor="middle">16-20K</text>
    <text x="22000" y="100" text-anchor="middle">20-24K</text>
    <text x="26000" y="100" text-anchor="middle">24-28K</text>
    <text x="30000" y="100" text-anchor="middle">28-32K</text>
    <text x="34000" y="100" text-anchor="middle">32-36K</text>
    <text x="38000" y="100" text-anchor="middle">36-40K</text>
  </g>

</svg>
