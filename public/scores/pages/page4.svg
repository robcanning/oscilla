       y="554.95856"
       id="tspan3"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page2)_style(size:&quot;50x25&quot;,color:&quot;#cc6644&quot;,label:&quot;C&quot;))</tspan><tspan
