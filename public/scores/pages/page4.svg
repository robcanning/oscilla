  <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;white-space:pre;inline-size:1042.95;fill:#000000"
     x="139.83051"
     y="229.66103"
     id="text7"
     transform="translate(0,-45.762712)"><tspan
       x="139.83051"
       y="229.66103"
       id="tspan23"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan20">cueGroup() — Reusable SVG Group Injection
</tspan></tspan><tspan
       x="139.83051"
       y="256.32765"
       id="tspan25"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan24">cueGroup() allows reusable clusters of cue elements, such as menus or control </tspan></tspan><tspan
       x="139.83051"
       y="282.99426"
       id="tspan27"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan26">panels, to be defined once in an SVG and recalled anywhere in the score.
</tspan></tspan><tspan
       x="139.83051"
       y="309.66088"
       id="tspan29"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan28">Any &lt;g&gt; element whose ID begins with group- is automatically registered when the </tspan></tspan><tspan
       x="139.83051"
       y="336.32751"
       id="tspan31"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan30">SVG loads. Triggering a cue like cueGroup(mainMenu) clones the corresponding </tspan></tspan><tspan
       x="139.83051"
       y="362.99414"
       id="tspan33"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan32">group and injects it into the current page. All contained cueButton() elements </tspan></tspan><tspan
       x="139.83051"
       y="389.66076"
       id="tspan35"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan34">are converted into visible, clickable buttons in the overlay.
</tspan></tspan><tspan
       x="139.83051"
       y="416.32739"
       id="tspan37"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan36">Groups retain their layout, styling, and cue behaviour, making it easy to design </tspan></tspan><tspan
       x="139.83051"
       y="442.99401"
       id="tspan39"><tspan
         style="font-weight:bold;-inkscape-font-specification:'FreeMono Bold'"
         id="tspan38">reusable interface blocks directly in Inkscape without duplicating code.</tspan></tspan></text>
</svg>
