       y="581.62518"
       id="tspan4"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:21.3333px;font-family:FreeMono;-inkscape-font-specification:FreeMono;fill:#ff0000">cueButton(cuePage(page3)_style(size:&quot;50x25&quot;,color:&quot;#888&quot;,label:&quot;D&quot;))</tspan><tspan
       sodipodi:role="line"
