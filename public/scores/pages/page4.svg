       y="608.29181"
       id="tspan13"
       style="font-size:21.3333px" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="634.95844"
       id="tspan14"
       style="font-size:21.3333px">and then placed in a inkscape group with the id <tspan
   style="fill:#0000ff"
   id="tspan22">group-mainMenu</tspan></tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="661.62506"
       style="font-size:21.3333px"
       id="tspan15" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="688.29169"
       style="font-size:21.3333px"
       id="tspan16">then in any other page we can create clones of this menu with:</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="714.95831"
       style="font-size:21.3333px"
       id="tspan21" /><tspan
       sodipodi:role="line"
       x="147.0233"
       y="751.49164"
       style="font-size:32px;fill:#0000ff"
       id="tspan19">cueGroup(mainMenu)</tspan><tspan
       sodipodi:role="line"
       x="147.0233"
       y="781.62494"
       style="font-size:21.3333px"
       id="tspan17" /><tspan
       sodipodi:role="line"
